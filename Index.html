<!doctype html>
<html>
<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">

  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      scroll-padding-top: env(safe-area-inset-top);
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #faf9f5;
      color: #141413;
    }

    img {
      max-width: 100%;
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important;
    }
  </style>
</head>

<body>
  <title>Meine Links</title>

  <link
    id="pre"
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    id="fonts"
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap"
  >

  <style id="css">
    /* Layout: one left-aligned column. Oversized name, link rows that fill on hover, a quiet members area below. */

    :root {
      --bg: #fafafa;
      --fg: #0a0a0a;
      --muted: #6b6b6b;
      --line: #e2e2e2;
      --invert-bg: #0a0a0a;
      --invert-fg: #fafafa;
      --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a0a0a;
        --fg: #f5f5f5;
        --muted: #8f8f8f;
        --line: #262626;
        --invert-bg: #f5f5f5;
        --invert-fg: #0a0a0a;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --muted: #8f8f8f;
      --line: #262626;
      --invert-bg: #f5f5f5;
      --invert-fg: #0a0a0a;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.55;
      padding-inline: 20px;
      padding-block: 28px 64px;
      -webkit-font-smoothing: antialiased;
    }

    body.has-bar {
      padding-bottom: 120px;
    }

    .wrap {
      max-width: 720px;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      gap: 72px;
    }

    /* entrance, first paint only */

    .intro .sec {
      animation: rise .7s var(--ease) both;
    }

    .intro .sec:nth-child(2) {
      animation-delay: .06s;
    }

    .intro .sec:nth-child(3) {
      animation-delay: .12s;
    }

    .intro .sec:nth-child(4) {
      animation-delay: .18s;
    }

    .intro .sec:nth-child(5) {
      animation-delay: .24s;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.97);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes shake {
      0%, 100% {
        transform: none;
      }

      20% {
        transform: translateX(-7px);
      }

      40% {
        transform: translateX(6px);
      }

      60% {
        transform: translateX(-4px);
      }

      80% {
        transform: translateX(3px);
      }
    }

    /* header */

    header.top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px 16px;
      flex-wrap: wrap;
    }

    .mark {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: .02em;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: 500 13px/1 var(--font-mono);
      min-width: 0;
      padding-right: 6px;
    }

    .chip .cn {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 14ch;
    }

    .tag {
      font: 500 11px/1 var(--font-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      border: 1px solid var(--fg);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .av {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--fg);
      color: var(--bg);
      padding: 5px;
      display: grid;
      flex: none;
      transition:
        transform .35s var(--ease),
        border-radius .35s var(--ease);
    }

    .chip:hover .av {
      transform: rotate(-6deg) scale(1.06);
      border-radius: 12px;
    }

    .av svg,
    .bigav svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* buttons: fill wipes up on hover */

    .btn {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      font: 500 13px/1 var(--font-mono);
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--fg);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      transition:
        color .3s,
        border-color .3s,
        transform .2s var(--ease);
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--fg);
      transform: translateY(102%);
      transition: transform .38s var(--ease);
    }

    .btn:hover::before {
      transform: none;
    }

    .btn:hover {
      color: var(--bg);
    }

    .btn:active {
      transform: scale(.96);
    }

    .btn.solid {
      background: var(--fg);
      color: var(--bg);
    }

    .btn.solid::before {
      background: var(--bg);
    }

    .btn.solid:hover {
      color: var(--fg);
    }

    .btn.ghost {
      border-color: var(--line);
    }

    .btn.ghost:hover {
      border-color: var(--fg);
    }

    .btn.icon {
      padding: 10px 11px;
      display: grid;
      place-items: center;
    }

    .btn.wide {
      width: 100%;
      padding: 14px 16px;
      font-size: 14px;
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn:focus-visible,
    .ib:focus-visible,
    .row:focus-visible,
    .tab:focus-visible,
    .bm a:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }

    /* hero */

    .hero {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(3rem, 14vw, 6.5rem);
      line-height: .95;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .lead {
      margin: 0;
      max-width: 34ch;
      font-size: clamp(1.1rem, 3.4vw, 1.35rem);
      line-height: 1.45;
      color: var(--muted);
      font-weight: 300;
    }

    .label {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
    }

    .hint {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 300;
      max-width: 52ch;
    }

    /* link rows */

    .list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line);
    }

    .row {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 20px 12px;
      margin-inline: -12px;
      border-bottom: 1px solid var(--line);
      color: var(--fg);
      text-decoration: none;
    }

    .row .fill {
      position: absolute;
      inset: 0;
      background: var(--invert-bg);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .45s var(--ease);
    }

    .row .txt,
    .row .arrow {
      position: relative;
      transition:
        color .3s,
        transform .45s var(--ease);
    }

    .row .name {
      display: block;
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: -.01em;
    }

    .row .meta {
      display: block;
      font-size: 14px;
      font-weight: 300;
      color: var(--muted);
      margin-top: 2px;
      transition:
        color .3s,
        opacity .3s;
    }

    .row .arrow {
      font-family: var(--font-mono);
      font-size: 18px;
    }

    .row:hover .fill {
      transform: scaleX(1);
    }

    .row:hover .name,
    .row:hover .arrow {
      color: var(--invert-fg);
    }

    .row:hover .meta {
      color: var(--invert-fg);
      opacity: .65;
    }

    .row:hover .txt {
      transform: translateX(6px);
    }

    .row:hover .arrow {
      transform: translate(-4px, 0) rotate(0deg);
    }

    .empty {
      margin: 0;
      color: var(--muted);
      font-weight: 300;
    }

    /* admin editor */

    .editor {
      border-top: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .erow {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      align-items: start;
      animation: fade .3s both;
    }

    .efields {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .ectl {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ib {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      font: 500 14px/1 var(--font-mono);
      cursor: pointer;
      transition:
        background .2s,
        color .2s,
        border-color .2s,
        transform .2s var(--ease);
    }

    .ib:hover {
      background: var(--invert-bg);
      color: var(--invert-fg);
      border-color: var(--invert-bg);
    }

    .ib:active {
      transform: scale(.92);
    }

    .ib:disabled {
      opacity: .3;
      pointer-events: none;
    }

    .inp {
      width: 100%;
      min-width: 0;
      font: 400 16px/1.4 var(--font-body);
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      transition: border-color .2s;
    }

    .inp::placeholder {
      color: var(--muted);
    }

    .inp:hover {
      border-color: var(--muted);
    }

    .inp:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
      border-color: var(--fg);
    }

    .inp.bad {
      border-color: var(--fg);
      animation: shake .4s;
    }

    textarea.inp {
      min-height: 180px;
      resize: vertical;
      line-height: 1.55;
    }

    /* admin bar */

    .abar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: var(--bg);
      border-top: 1px solid var(--line);
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
      animation: rise .4s var(--ease) both;
    }

    .abar-in {
      max-width: 720px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      flex-wrap: wrap;
    }

    .abar-s {
      font: 500 13px/1.3 var(--font-mono);
      color: var(--muted);
    }

    .abar-b {
      display: flex;
      gap: 8px;
    }

    /* members area */

    .tabs {
      display: flex;
      gap: 22px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 26px;
      overflow-x: auto;
    }

    .tab {
      position: relative;
      background: none;
      border: 0;
      padding: 10px 0;
      font: 500 14px var(--font-body);
      color: var(--muted);
      cursor: pointer;
      transition: color .2s;
      white-space: nowrap;
    }

    .tab::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--fg);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .35s var(--ease);
    }

    .tab:hover,
    .tab.on {
      color: var(--fg);
    }

    .tab:not(.on):hover::after {
      transform: scaleX(.35);
    }

    .tab.on::after {
      transform: scaleX(1);
    }

    .panel {
      animation: fade .35s both;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .bigav {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: var(--fg);
      color: var(--bg);
      padding: 12px;
      display: grid;
      flex: none;
      transition:
        transform .5s var(--ease),
        border-radius .5s var(--ease);
    }

    .bigav:hover {
      transform: rotate(-8deg) scale(1.05);
      border-radius: 26px;
    }

    .pn {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: -.02em;
      overflow-wrap: anywhere;
    }

    .ps {
      font: 400 13px var(--font-mono);
      color: var(--muted);
    }

    .panel p {
      margin: 0;
      color: var(--muted);
      font-weight: 300;
      max-width: 52ch;
    }

    .bmform {
      display: grid;
      grid-template-columns: 1fr 1.4fr auto;
      gap: 8px;
    }

    .bm {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      animation: fade .3s both;
    }

    .bm a {
      color: var(--fg);
      text-decoration: none;
      min-width: 0;
      display: block;
    }

    .bm .bn {
      font-weight: 500;
      background: linear-gradient(currentColor, currentColor) left bottom / 0 1px no-repeat;
      transition: background-size .4s var(--ease);
    }

    .bm a:hover .bn {
      background-size: 100% 1px;
    }

    .bm .bh {
      display: block;
      font: 400 12px var(--font-mono);
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nmeta {
      font: 400 12px var(--font-mono);
      color: var(--muted);
    }

    /* texts the admin can edit in place */

    .ed {
      cursor: text;
      border-radius: 4px;
      outline: 1px dashed transparent;
      outline-offset: 6px;
      transition:
        outline-color .2s,
        background-color .2s;
    }

    .ed:hover {
      outline-color: var(--muted);
    }

    .ed:focus {
      outline: 2px solid var(--fg);
      background: color-mix(in srgb, var(--fg) 5%, transparent);
    }

    .ed:empty::before {
      content: "Text hinzufügen";
      color: var(--muted);
      font-weight: 300;
    }

    /* about */

    .about {
      display: grid;
      gap: 28px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 28px;
    }

    .fact {
      padding-top: 16px;
      border-top: 1px solid var(--line);
      transition: border-color .3s;
    }

    .fact:hover {
      border-top-color: var(--fg);
    }

    .fact h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      font-weight: 500;
    }

    .fact p {
      margin: 0;
      font-size: 15px;
      color: var(--muted);
      font-weight: 300;
    }

    footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    /* modal */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      animation: fade .25s both;
    }

    .modal {
      position: relative;
      width: min(420px, 100%);
      background: var(--bg);
      border: 1px solid var(--fg);
      border-radius: 18px;
      padding: 28px;
      animation: pop .4s var(--ease) both;
    }

    .modal.shake {
      animation: shake .4s;
    }

    .modal h2 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -.03em;
    }

    .modal .mp {
      margin: 0 0 22px;
      color: var(--muted);
      font-weight: 300;
      font-size: 15px;
    }

    .modal label {
      display: block;
      font: 500 12px var(--font-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .modal .x {
      position: absolute;
      top: 14px;
      right: 14px;
    }

    .pw {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition:
        grid-template-rows .4s var(--ease),
        opacity .3s,
        margin .4s var(--ease);
    }

    .pw.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 16px;
    }

    .pwi {
      overflow: hidden;
      min-height: 0;
      padding: 2px;
      margin: -2px;
    }

    .err {
      min-height: 1.4em;
      margin: 12px 0 14px;
      font-size: 14px;
      color: var(--fg);
      font-weight: 500;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 60;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      background: var(--fg);
      color: var(--bg);
      padding: 12px 18px;
      border-radius: 999px;
      font: 500 14px var(--font-body);
      max-width: calc(100% - 40px);
      text-align: center;
      transition:
        opacity .3s,
        transform .4s var(--ease);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body.has-bar .toast {
      bottom: 96px;
    }

    @media (max-width: 520px) {
      .bmform {
        grid-template-columns: 1fr;
      }

      .wrap {
        gap: 56px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

  <div id="mount"></div>

      <section class="sec" id="member" hidden=""></section>

      <section class="about sec">

        </p>

        <div class="facts">
          <div class="fact">

            </p>
          </div>
        </div>
      </section>

      <footer class="sec">
        <span data-t="foot">© 2026</span>
      </footer>
    </div>
  </template>

            '<form class="bmform" data-form="bm" novalidate>' +

            '<input class="inp" id="bm-name" placeholder="Name" maxlength="40" aria-label="Name">' +

            '<input class="inp" id="bm-url" placeholder="https://…" inputmode="url" autocapitalize="none" spellcheck="false" aria-label="Adresse">' +

            '<button class="btn solid" type="submit">' +
            'Speichern' +
            '</button>' +

            '</form>';

          h += bm.length
            ? '<div>' +
              bm.map(function (b, i) {
                return (
                  '<div class="bm">' +

                  '<a href="' +
                  esc(b.url) +
                  '" target="_blank" rel="noopener">' +

                  '<span class="bn">' +
                  esc(b.name) +
                  '</span>' +

                  '<span class="bh">' +
                  esc(host(b.url)) +
                  '</span>' +

                  '</a>' +

                  '<button class="ib" type="button" data-act="bm-del" data-i="' +
                  i +
                  '" aria-label="Lesezeichen löschen">' +
                  '✕' +
                  '</button>' +

                  '</div>'
                );
              }).join('') +
              '</div>'
            : '<p>Noch keine Lesezeichen. Speichere hier Seiten, die du dir merken willst.</p>';
        } else {
          var note =
            get(LS, noteKey()) || '';

          h +=
            '<textarea class="inp" id="notes" maxlength="5000" placeholder="Schreib hier irgendwas auf …" aria-label="Notizen">' +
            esc(note) +
            '</textarea>' +

            '<span class="nmeta" id="ncount">' +
            note.length +
            ' Zeichen · wird automatisch gespeichert' +
            '</span>';
        }

        h += '</div>';

        el.innerHTML = h;
      }

      function addBm() {
        var u = normUrl(
          $('bm-url').value
        );

        var n =
          $('bm-name').value.trim();

        if (!u) {
          $('bm-url').classList.add(
            'bad'
          );

          toast(
            'Gib eine gültige Adresse ein.'
          );

          return;
        }

        var bm = readBm();

        bm.push({
          name: n || host(u),
          url: u
        });

        put(
          LS,
          bmKey(),
          JSON.stringify(bm)
        );

        renderMember();
      }

      /* ---------- login modal ---------- */

      var ov =
        document.createElement('div');

      ov.className = 'overlay';
      ov.hidden = true;

      ov.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">' +

        '<button class="ib x" type="button" data-act="close" aria-label="Schließen">' +
        '✕' +
        '</button>' +

        '<h2 id="mt">Registrieren</h2>' +

        '<p class="mp" id="mp">' +
        'Such dir einen Usernamen aus. Mehr brauchst du nicht.' +
        '</p>' +

        '<form id="rf" novalidate>' +

        '<label for="ru">Username</label>' +

        '<input class="inp" id="ru" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="20" placeholder="dein_name">' +

        '<div class="pw" id="pwrow">' +

        '<div class="pwi">' +

        '<label for="rp">Passwort</label>' +

        '<input class="inp" id="rp" type="password" autocomplete="current-password">' +

        '</div>' +
        '</div>' +

        '<p class="err" id="err" role="alert"></p>' +

        '<button class="btn solid wide" id="rs" type="submit">' +
        'Registrieren' +
        '</button>' +

        '</form>' +
        '</div>';

      document.body.appendChild(ov);

      var ru = $('ru');
      var rp = $('rp');
      var pwrow = $('pwrow');
      var errEl = $('err');
      var rs = $('rs');
      var modal = ov.firstChild;
      var lastFocus = null;

      function setErr(m) {
        errEl.textContent = m || '';
      }

      function syncPw() {
        var isA =
          ru.value.trim().toLowerCase() ===
          ADMIN;

        pwrow.classList.toggle(
          'open',
          isA
        );

        pwrow.inert = !isA;

        rs.textContent = isA
          ? 'Anmelden'
          : 'Registrieren';

        if (!isA) {
          rp.value = '';
        }
      }

      function openModal(prefill) {
        lastFocus =
          document.activeElement;

        $('mt').textContent = prefill
          ? 'Admin entsperren'
          : 'Registrieren';

        $('mp').textContent = prefill
          ? 'Gib dein Passwort ein, um die Links zu bearbeiten.'
          : 'Such dir einen Usernamen aus. Mehr brauchst du nicht.';

        ru.value = prefill || '';
        rp.value = '';

        setErr('');
        syncPw();

        ov.hidden = false;

        setTimeout(function () {
          (
            prefill
              ? rp
              : ru
          ).focus();
        }, 60);
      }

      function closeModal() {
        ov.hidden = true;

        if (
          lastFocus &&
          lastFocus.focus
        ) {
          try {
            lastFocus.focus();
          } catch (e) {}
        }
      }

      function fail(msg) {
        setErr(msg);

        modal.classList.remove(
          'shake'
        );

        void modal.offsetWidth;

        modal.classList.add('shake');
      }

      function hex2buf(h) {
        var a =
          new Uint8Array(
            h.length / 2
          );

        for (
          var i = 0;
          i < a.length;
          i++
        ) {
          a[i] =
            parseInt(
              h.substr(i * 2, 2),
              16
            );
        }

        return a;
      }

      function buf2hex(b) {
        return [].map.call(
          new Uint8Array(b),
          function (x) {
            return (
              '0' +
              x.toString(16)
            ).slice(-2);
          }
        ).join('');
      }

      async function verify(pw) {
        try {
          var key =
            await crypto.subtle.importKey(
              'raw',
              new TextEncoder().encode(pw),
              'PBKDF2',
              false,
              ['deriveBits']
            );

          var bits =
            await crypto.subtle.deriveBits(
              {
                name: 'PBKDF2',
                salt: hex2buf(SALT),
                iterations: ITER,
                hash: 'SHA-256'
              },
              key,
              256
            );

          return (
            buf2hex(bits) === HASH
          );
        } catch (e) {
          return false;
                function setUser(name) {
        var since =
          user &&
          user.name === name
            ? user.since
            : new Date().toISOString();

        user = {
          name: name,
          since: since
        };

        put(
          LS,
          'eb_user',
          JSON.stringify(user)
        );

        tab = 'profil';
      }

      ru.addEventListener(
        'input',
        function () {
          syncPw();
          setErr('');
        }
      );

      rp.addEventListener(
        'input',
        function () {
          setErr('');
        }
      );

      $('rf').addEventListener(
        'submit',
        async function (e) {
          e.preventDefault();

          var name =
            ru.value
              .trim()
              .toLowerCase();

          if (!NAME_RE.test(name)) {
            fail(
              'Nutze 3 bis 20 Zeichen: Buchstaben, Zahlen, Punkt, Strich oder Unterstrich.'
            );
            return;
          }

          if (name === ADMIN) {
            if (!rp.value) {
              fail(
                'Gib das Passwort ein.'
              );
              return;
            }

            rs.disabled = true;

            var ok =
              await verify(rp.value);

            rs.disabled = false;

            if (!ok) {
              rp.value = '';

              fail(
                'Falsches Passwort.'
              );

              rp.focus();

              return;
            }

            put(
              SS,
              'eb_admin',
              '1'
            );

            admin = true;
            draft = clone(links);
            dtexts = clone(texts);
          } else {
            drop(
              SS,
              'eb_admin'
            );

            admin = false;
            draft = null;
            dtexts = null;
          }

          setUser(name);

          ov.hidden = true;
          lastFocus = null;

          renderAll();

          toast(
            admin
              ? 'Admin-Modus aktiv.'
              : 'Willkommen, ' + name + '.'
          );
        }
      );

      ov.addEventListener(
        'mousedown',
        function (e) {
          if (e.target === ov) {
            closeModal();
          }
        }
      );

      document.addEventListener(
        'keydown',
        function (e) {
          if (
            e.key === 'Escape' &&
            !ov.hidden
          ) {
            closeModal();
          }
        }
      );

      document.addEventListener(
        'click',
        function (e) {
          var b =
            e.target.closest
              ? e.target.closest(
                  '[data-act]'
                )
              : null;

          if (!b) {
            return;
          }

          var act = b.dataset.act;
          var i = +b.dataset.i;

          if (act === 'register') {
            openModal('');
          }

          else if (act === 'unlock') {
            openModal(user.name);
          }

          else if (act === 'close') {
            closeModal();
          }

          else if (act === 'logout') {
            user = null;
            admin = false;
            draft = null;
            dtexts = null;
            busy = false;

            drop(
              LS,
              'eb_user'
            );

            drop(
              SS,
              'eb_admin'
            );

            renderAll();

            toast(
              'Abgemeldet.'
            );
          }

          else if (act === 'theme') {
            var n =
              theme() === 'dark'
                ? 'light'
                : 'dark';

            root.setAttribute(
              'data-theme',
              n
            );

            put(
              LS,
              'theme',
              n
            );
          }

          else if (act === 'tab') {
            tab = b.dataset.t;
            renderMember();
          }

          else if (act === 'bm-del') {
            var bm = readBm();

            bm.splice(i, 1);

            put(
              LS,
              bmKey(),
              JSON.stringify(bm)
            );

            renderMember();
          }

          else if (
            admin &&
            act === 'add'
          ) {
            draft.push({
              label: '',
              meta: '',
              url: ''
            });

            renderLinks();

            var ins =
              $('links').querySelectorAll(
                '.erow'
              );

            var last =
              ins[ins.length - 1];

            if (last) {
              last
                .querySelector('.inp')
                .focus();
            }
          }

          else if (
            admin &&
            act === 'del'
          ) {
            draft.splice(i, 1);

            renderLinks();
          }

          else if (
            admin &&
            act === 'up' &&
            i > 0
          ) {
            var t1 =
              draft[i - 1];

            draft[i - 1] =
              draft[i];

            draft[i] = t1;

            renderLinks();
          }

          else if (
            admin &&
            act === 'down' &&
            i < draft.length - 1
          ) {
            var t2 =
              draft[i + 1];

            draft[i + 1] =
              draft[i];

            draft[i] = t2;

            renderLinks();
          }

          else if (
            admin &&
            act === 'reset'
          ) {
            draft = clone(links);
            dtexts = clone(texts);

            renderLinks();

            toast(
              'Änderungen verworfen.'
            );
          }

          else if (
            admin &&
            act === 'publish'
          ) {
            publishLinks();
          }
        }
      );

      document.addEventListener(
        'input',
        function (e) {
          var t = e.target;

          if (
            admin &&
            t.dataset &&
            t.dataset.t
          ) {
            dtexts[t.dataset.t] =
              t.textContent;

            updateBar();
          }

          else if (
            admin &&
            t.dataset &&
            t.dataset.f
          ) {
            var row =
              t.closest('[data-i]');

            if (row) {
              draft[
                +row.dataset.i
              ][t.dataset.f] =
                t.value;

              t.classList.remove(
                'bad'
              );

              updateBar();
            }
          }

          else if (
            user &&
            t.id === 'notes'
          ) {
            put(
              LS,
              noteKey(),
              t.value
            );

            $('ncount').textContent =
              t.value.length +
              ' Zeichen · wird automatisch gespeichert';
          }

          else if (
            t.id === 'bm-url'
          ) {
            t.classList.remove(
              'bad'
            );
          }
        }
      );

      document.addEventListener(
        'submit',
        function (e) {
          if (
            e.target.dataset &&
            e.target.dataset.form ===
              'bm'
          ) {
            e.preventDefault();
            addBm();
          }
        }
      );

      function renderAll() {
        renderTop();
        renderLinks();
        renderMember();
        applyTexts();
      }

      renderAll();
    })();
  </script>
</body>
</html>
