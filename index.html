<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Meine Links</title>
<link id="pre" rel="preconnect" href="https://fonts.googleapis.com">
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style id="css">
  /* Layout: one left-aligned column. Oversized name, link rows that fill on hover, a quiet members area below. */
  :root {
    --bg: #fafafa;
    --fg: #0a0a0a;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --invert-bg: #0a0a0a;
    --invert-fg: #fafafa;
    --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a0a; --fg: #f5f5f5; --muted: #8f8f8f; --line: #262626;
      --invert-bg: #f5f5f5; --invert-fg: #0a0a0a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a; --fg: #f5f5f5; --muted: #8f8f8f; --line: #262626;
    --invert-bg: #f5f5f5; --invert-fg: #0a0a0a; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    padding-inline: 20px;
    padding-block: 28px 64px;
    -webkit-font-smoothing: antialiased;
  }
  body.has-bar { padding-bottom: 120px; }
  .wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 72px; }

  /* entrance, first paint only */
  .intro .sec { animation: rise .7s var(--ease) both; }
  .intro .sec:nth-child(2) { animation-delay: .06s; }
  .intro .sec:nth-child(3) { animation-delay: .12s; }
  .intro .sec:nth-child(4) { animation-delay: .18s; }
  .intro .sec:nth-child(5) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

  /* header */
  header.top { display: flex; justify-content: flex-end; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
  .mark { font-family: var(--font-mono); font-size: 13px; letter-spacing: .02em; color: var(--muted); }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font: 500 13px/1 var(--font-mono); min-width: 0; padding-right: 6px; }
  .chip .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14ch; }
  .tag { font: 500 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--fg); border-radius: 999px; padding: 4px 8px; }
  .av { width: 28px; height: 28px; border-radius: 8px; background: var(--fg); color: var(--bg); padding: 5px; display: grid; flex: none; transition: transform .35s var(--ease), border-radius .35s var(--ease); }
  .chip:hover .av { transform: rotate(-6deg) scale(1.06); border-radius: 12px; }
  .av svg, .bigav svg { width: 100%; height: 100%; display: block; }

  /* buttons: fill wipes up on hover */
  .btn {
    position: relative; isolation: isolate; overflow: hidden;
    font: 500 13px/1 var(--font-mono);
    padding: 10px 16px; border-radius: 999px;
    border: 1px solid var(--fg); background: transparent; color: var(--fg);
    cursor: pointer;
    transition: color .3s, border-color .3s, transform .2s var(--ease);
  }
  .btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--fg); transform: translateY(102%); transition: transform .38s var(--ease); }
  .btn:hover::before { transform: none; }
  .btn:hover { color: var(--bg); }
  .btn:active { transform: scale(.96); }
  .btn.solid { background: var(--fg); color: var(--bg); }
  .btn.solid::before { background: var(--bg); }
  .btn.solid:hover { color: var(--fg); }
  .btn.ghost { border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--fg); }
  .btn.icon { padding: 10px 11px; display: grid; place-items: center; }
  .btn.wide { width: 100%; padding: 14px 16px; font-size: 14px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
  .btn:focus-visible, .ib:focus-visible, .row:focus-visible, .tab:focus-visible, .bm a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* hero */
  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .dstat { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; font: 500 12px/1.3 var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; transition: border-color .3s, color .3s; }
  .dstat:hover { border-color: var(--fg); color: var(--fg); }
  .dstat[hidden] { display: none; }
  .dd { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
  .dstat.on .dd, .dstat.idle .dd, .dstat.dnd .dd, .dstat.up .dd { background: var(--fg); border-color: var(--fg); }
  .dstat.idle .dd { background: linear-gradient(90deg, var(--fg) 50%, transparent 50%); }
  .dstat.dnd .dd { background: transparent; box-shadow: inset 0 0 0 2px var(--bg), inset 0 0 0 5px var(--fg); }
  .dstat.on .dd, .dstat.up .dd { animation: dping 2.4s ease-out infinite; }
  @keyframes dping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--fg) 45%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
  .hero { display: flex; flex-direction: column; gap: 24px; }
  h1 { margin: 0; font-weight: 600; font-size: clamp(3rem, 14vw, 6.5rem); line-height: .95; letter-spacing: -.045em; text-wrap: balance; }
  .lead { margin: 0; max-width: 34ch; font-size: clamp(1.1rem, 3.4vw, 1.35rem); line-height: 1.45; color: var(--muted); font-weight: 300; }
  .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  .hint { margin: 0 0 8px; color: var(--muted); font-size: 14px; font-weight: 300; max-width: 52ch; }

  /* link rows */
  .list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .row {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px;
    padding: 20px 12px; margin-inline: -12px;
    border-bottom: 1px solid var(--line);
    color: var(--fg); text-decoration: none;
  }
  .row .fill { position: absolute; inset: 0; background: var(--invert-bg); transform: scaleX(0); transform-origin: left; transition: transform .45s var(--ease); }
  .row .txt, .row .arrow { position: relative; transition: color .3s, transform .45s var(--ease); }
  .row .name { display: block; font-size: 1.2rem; font-weight: 500; letter-spacing: -.01em; }
  .row .meta { display: block; font-size: 14px; font-weight: 300; color: var(--muted); margin-top: 2px; transition: color .3s, opacity .3s; }
  .row .arrow { font-family: var(--font-mono); font-size: 18px; }
  .row:hover .fill { transform: scaleX(1); }
  .row:hover .name, .row:hover .arrow { color: var(--invert-fg); }
  .row:hover .meta { color: var(--invert-fg); opacity: .65; }
  .row:hover .txt { transform: translateX(6px); }
  .row:hover .arrow { transform: translate(-4px, 0) rotate(0deg); }
  .empty { margin: 0; color: var(--muted); font-weight: 300; }

  /* admin editor */
  .editor { border-top: 1px solid var(--line); margin-bottom: 18px; }
  .erow { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: start; animation: fade .3s both; }
  .efields { display: grid; gap: 8px; min-width: 0; }
  .ectl { display: flex; flex-direction: column; gap: 6px; }
  .ib { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 500 14px/1 var(--font-mono); cursor: pointer; transition: background .2s, color .2s, border-color .2s, transform .2s var(--ease); }
  .ib:hover { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
  .ib:active { transform: scale(.92); }
  .ib:disabled { opacity: .3; pointer-events: none; }

  .inp {
    width: 100%; min-width: 0;
    font: 400 16px/1.4 var(--font-body); color: var(--fg);
    background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    transition: border-color .2s;
  }
  .inp::placeholder { color: var(--muted); }
  .inp:hover { border-color: var(--muted); }
  .inp:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-color: var(--fg); }
  .inp.bad { border-color: var(--fg); animation: shake .4s; }
  textarea.inp { min-height: 180px; resize: vertical; line-height: 1.55; }

  /* admin bar */
  .abar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); animation: rise .4s var(--ease) both; }
  .abar-in { max-width: 720px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .abar-s { font: 500 13px/1.3 var(--font-mono); color: var(--muted); }
  .abar-b { display: flex; gap: 8px; }

  /* members area */
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 26px; overflow-x: auto; }
  .tab { position: relative; background: none; border: 0; padding: 10px 0; font: 500 14px var(--font-body); color: var(--muted); cursor: pointer; transition: color .2s; white-space: nowrap; }
  .tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--fg); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease); }
  .tab:hover, .tab.on { color: var(--fg); }
  .tab:not(.on):hover::after { transform: scaleX(.35); }
  .tab.on::after { transform: scaleX(1); }
  .panel { animation: fade .35s both; display: flex; flex-direction: column; gap: 16px; }
  .profile { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .bigav { width: 72px; height: 72px; border-radius: 18px; background: var(--fg); color: var(--bg); padding: 12px; display: grid; flex: none; transition: transform .5s var(--ease), border-radius .5s var(--ease); }
  .bigav:hover { transform: rotate(-8deg) scale(1.05); border-radius: 26px; }
  .pn { font-size: 1.4rem; font-weight: 500; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .ps { font: 400 13px var(--font-mono); color: var(--muted); }
  .panel p { margin: 0; color: var(--muted); font-weight: 300; max-width: 52ch; }
  .bmform { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; }
  .bm { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); animation: fade .3s both; }
  .bm a { color: var(--fg); text-decoration: none; min-width: 0; display: block; }
  .bm .bn { font-weight: 500; background: linear-gradient(currentColor, currentColor) left bottom / 0 1px no-repeat; transition: background-size .4s var(--ease); }
  .bm a:hover .bn { background-size: 100% 1px; }
  .bm .bh { display: block; font: 400 12px var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nmeta { font: 400 12px var(--font-mono); color: var(--muted); }
  .lock { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding: 28px; border: 1px dashed var(--line); border-radius: 14px; transition: border-color .3s; }
  .lock:hover { border-color: var(--fg); }
  .lock p { margin: 0; color: var(--muted); font-weight: 300; font-size: 1.1rem; }
  .ftools { display: flex; gap: 8px; margin-bottom: 14px; }
  .ftools .inp { flex: 1; }
  #flist { border-top: 1px solid var(--line); }
  #flist .empty { padding-top: 16px; }
  .btn.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn.on::before { background: var(--bg); }
  .btn.on:hover { color: var(--fg); }
  .fx { display: flex; gap: 6px; }
  .ib.star.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .new { display: inline-block; vertical-align: middle; margin-left: 8px; font: 500 10px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--fg); border-radius: 999px; padding: 3px 7px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 16px; padding: 16px 0; border-block: 1px solid var(--line); }
  .sv { display: block; font-size: 1.25rem; font-weight: 500; letter-spacing: -.02em; color: var(--fg); }
  .sl { display: block; font: 400 12px var(--font-mono); color: var(--muted); }
  .nrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .fa { font: 18px var(--font-mono); color: var(--muted); transition: transform .4s var(--ease), color .3s; }
  .bm:hover .fa { transform: translate(3px, -3px); color: var(--fg); }

  /* texts the admin can edit in place */
  .ed { cursor: text; border-radius: 4px; outline: 1px dashed transparent; outline-offset: 6px; transition: outline-color .2s, background-color .2s; }
  .ed:hover { outline-color: var(--muted); }
  .ed:focus { outline: 2px solid var(--fg); background: color-mix(in srgb, var(--fg) 5%, transparent); }
  .ed:empty::before { content: "Text hinzufügen"; color: var(--muted); font-weight: 300; }

  /* about */
  .about { display: grid; gap: 28px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px; }
  .fact { padding-top: 16px; border-top: 1px solid var(--line); transition: border-color .3s; }
  .fact:hover { border-top-color: var(--fg); }
  .fact h3 { margin: 0 0 6px; font-size: 1rem; font-weight: 500; }
  .fact p { margin: 0; font-size: 15px; color: var(--muted); font-weight: 300; }

  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 20px; }

  [hidden] { display: none !important; }
  /* cookie banner, demo chat, status */
  .cb { position: fixed; left: 16px; bottom: 16px; z-index: 45; width: calc(100% - 32px); max-width: 460px; background: var(--bg); border: 1px solid var(--fg); border-radius: 16px; padding: 18px; display: grid; gap: 14px; animation: pop .4s var(--ease) both; }
  .cb p { margin: 0; font-size: 14px; color: var(--muted); font-weight: 300; }
  .cb-b { display: flex; gap: 8px; flex-wrap: wrap; }
  body.has-bar .cb { bottom: 96px; }
  .dm-cmds { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .dm { border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 96px; }
  .dm .empty { font-size: 14px; }
  .dm-m { display: grid; grid-template-columns: 36px 1fr; gap: 12px; animation: fade .3s both; }
  .dm-a { width: 36px; height: 36px; border-radius: 50%; background: var(--line); color: var(--fg); display: grid; place-items: center; font: 600 14px var(--font-body); }
  .dm-a.bot { background: var(--fg); color: var(--bg); border-radius: 10px; }
  .dm-n { font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .dm-t { font-size: 15px; color: var(--muted); font-weight: 300; overflow-wrap: anywhere; }
  .dm-c { font-family: var(--font-mono); color: var(--fg); }
  .dm-dots span { display: inline-block; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .stform { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  a.btn { text-decoration: none; display: inline-block; }
  .fl { display: flex; gap: 16px; flex-wrap: wrap; }

  /* server card + impressum */
  .scard { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; transition: border-color .3s; }
  .scard:hover { border-color: var(--fg); }
  .sic { width: 56px; height: 56px; border-radius: 14px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font: 600 22px var(--font-body); overflow: hidden; flex: none; }
  .sic img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .sname { font-size: 1.15rem; font-weight: 500; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .smeta { font: 400 13px var(--font-mono); color: var(--muted); }
  .scard .btn { text-decoration: none; display: inline-block; }
  .lnk { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .lnk:hover { color: var(--fg); }
  .imp h3 { margin: 18px 0 6px; font-size: 1rem; font-weight: 500; }
  .imp h3:first-child { margin-top: 0; }
  .imp p { margin: 0 0 4px; font-size: 15px; color: var(--muted); font-weight: 300; }
  .imp a { color: var(--fg); }
  @media (max-width: 520px) { .scard { grid-template-columns: auto 1fr; } .scard .btn { grid-column: 1 / -1; text-align: center; } }

  /* bot request */
  .rqf { margin-bottom: 14px; }
  textarea.inp.rqt { min-height: 120px; }
  .modal.big { max-height: calc(100dvh - 40px); overflow: auto; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .reqbox { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }

  /* bot builder */
  .bbf { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .bbg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 14px 0; }
  .bbc { text-align: left; font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; display: grid; gap: 8px; align-content: start; transition: background .3s, color .3s, border-color .3s, transform .2s var(--ease); }
  .bbc:hover { border-color: var(--fg); }
  .bbc:active { transform: scale(.98); }
  .bbc:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .bbc[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .bbc b { font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
  .bbc small { font-weight: 300; font-size: 13px; line-height: 1.4; opacity: .7; }
  .bbk { display: flex; flex-wrap: wrap; gap: 4px; }
  .bbk i { font: 400 11px var(--font-mono); font-style: normal; border: 1px solid currentColor; border-radius: 999px; padding: 2px 7px; opacity: .75; }
  .bbs { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 520px) { .bbf { grid-template-columns: 1fr; } }

  .bbr { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .bbx { display: grid; gap: 8px; margin: 14px 0; }
  /* modal */
  :root[data-acc=blue]{--ac:#2563eb}:root[data-acc=green]{--ac:#16a34a}:root[data-acc=purple]{--ac:#7c3aed}:root[data-acc=orange]{--ac:#ea580c}
  :root[data-acc]{--invert-bg:var(--ac)!important;--invert-fg:#fff!important}
  :root[data-acc] .btn.solid,:root[data-acc] .av{background:var(--ac);border-color:var(--ac);color:#fff}
  :root[data-acc] .btn.solid:hover{color:var(--ac)}
  :root[data-fs=s] .wrap{zoom:.92}:root[data-fs=l] .wrap{zoom:1.12}
  :root[data-calm] *,:root[data-calm] *::before,:root[data-calm] *::after{animation:none!important;transition:none!important}
  .sr{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
  .sr>span{font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .sg{display:flex;flex-wrap:wrap;gap:6px}.sg .btn{padding:8px 12px;font-size:12px}
  .overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: fade .25s both; }
  .modal { position: relative; width: min(420px, 100%); background: var(--bg); border: 1px solid var(--fg); border-radius: 18px; padding: 28px; animation: pop .4s var(--ease) both; }
  .modal.shake { animation: shake .4s; }
  .modal h2 { margin: 0 0 6px; font-size: 1.6rem; font-weight: 600; letter-spacing: -.03em; }
  .modal .mp { margin: 0 0 22px; color: var(--muted); font-weight: 300; font-size: 15px; }

  var DID = '1509263591000510585';
  function pollStatus() {
    var el = document.getElementById('dstat'); if (!el || !window.fetch || !ext()) return;
    fetch('https://api.lanyard.rest/v1/users/' + DID).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.success) { el.hidden = true; return; }
      var d = j.data, st = d.discord_status || 'offline';
      var names = { online: 'Online', idle: 'Abwesend', dnd: 'Bitte nicht stören', offline: 'Offline' };
      var cls = st === 'online' ? 'on' : st;
      var txt = names[st] || 'Offline', extra = '';
      var acts = d.activities || [];
      for (var i = 0; i < acts.length; i++) {
        if (acts[i].type === 4 && acts[i].state) extra = acts[i].state;
        else if (acts[i].type === 0 && !extra) extra = 'Spielt ' + acts[i].name;
      }
      el.className = 'dstat ' + cls; el.hidden = false;
      el.querySelector('.dt').textContent = 'Discord · ' + txt + (extra ? ' · ' + extra : '');
    }).catch(function () { el.hidden = true; });
  }
  pollStatus(); setInterval(pollStatus, 30000);


  // Server-Karte: Zahlen und Icon direkt vom Discord-Invite (nur mit Zustimmung)
  var INVITE = 'ySwntZUFBh';
  function pollServer() {
    if (!window.fetch || !ext()) return;
    fetch('https://discord.com/api/v10/invites/' + INVITE + '?with_counts=true').then(function (r) { return r.json(); }).then(function (j) {
      var g = j && j.guild; if (!g) return;
      if (j.approximate_member_count != null) { srvData = { m: j.approximate_member_count, o: j.approximate_presence_count }; renderSrv(); }
      var ic = $('sic');
      if (g.icon) { var im = document.createElement('img'); im.alt = ''; im.src = 'https://cdn.discordapp.com/icons/' + g.id + '/' + g.icon + '.png?size=128'; ic.textContent = ''; ic.appendChild(im); }
    }).catch(function () {});
  }
  pollServer(); setInterval(pollServer, 120000);

  /* ---------- Einstellungen ---------- */
  var S0 = { acc: 'mono', fs: 'm', calm: false, egg: true }, S = Object.assign({}, S0);
  try { Object.assign(S, JSON.parse(get(LS, 'eb_set') || '{}')); } catch (e) {}
  function applySet() {
    if (S.acc !== 'mono') root.setAttribute('data-acc', S.acc); else root.removeAttribute('data-acc');
    root.setAttribute('data-fs', S.fs);
    if (S.calm) root.setAttribute('data-calm', ''); else root.removeAttribute('data-calm');
  }
  applySet();
  var sp = document.createElement('div'); sp.className = 'overlay'; sp.hidden = true; document.body.appendChild(sp);
  function curTheme() { var t = get(LS, 'theme'); return t === 'dark' || t === 'light' ? t : 'system'; }
  function seg(k, cur, o) { return '<div class="sg">' + o.map(function (x) { return '<button class="btn ' + (x[0] === cur ? 'solid' : 'ghost') + '" type="button" data-sk="' + k + '" data-sv="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>'; }
  function srow(t, h) { return '<div class="sr"><span>' + esc(t) + '</span>' + h + '</div>'; }
  function renderSet() {
    var on = L('An', 'On'), off = L('Aus', 'Off');
    sp.innerHTML = '<div class="modal" role="dialog" aria-modal="true" style="max-height:calc(100dvh - 40px);overflow:auto"><button class="ib x" type="button" data-sk="close" aria-label="Close">✕</button><h2>' + esc(L('Einstellungen', 'Settings')) + '</h2>' +
      srow(L('Design', 'Theme'), seg('theme', curTheme(), [['system', 'System'], ['light', L('Hell', 'Light')], ['dark', L('Dunkel', 'Dark')]])) +
      srow(L('Akzentfarbe', 'Accent'), seg('acc', S.acc, [['mono', L('Schwarz-Weiß', 'Mono')], ['blue', L('Blau', 'Blue')], ['green', L('Grün', 'Green')], ['purple', L('Lila', 'Purple')], ['orange', 'Orange']])) +
      srow(L('Schriftgröße', 'Text size'), seg('fs', S.fs, [['s', L('Klein', 'Small')], ['m', 'Normal'], ['l', L('Groß', 'Large')]])) +
      srow(L('Animationen', 'Animations'), seg('calm', S.calm ? '1' : '0', [['0', on], ['1', off]])) +
      srow(L('Externe Dienste (Discord-Status, Server-Zahlen)', 'External services (Discord status, server stats)'), seg('ext', ext() ? '1' : '0', [['1', on], ['0', off]])) +
      srow('Easter Eggs', seg('egg', S.egg ? '1' : '0', [['1', on], ['0', off]])) +
      '<div class="sr"><button class="btn ghost wide" type="button" data-sk="reset">' + esc(L('Zurücksetzen', 'Reset')) + '</button></div></div>';
  }
  function closeSet() { sp.hidden = true; }
  sp.addEventListener('mousedown', function (e) { if (e.target === sp) closeSet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sp.hidden) closeSet(); });
  sp.addEventListener('click', function (e) {
    var b = e.target.closest('[data-sk]'); if (!b) return;
    var k = b.dataset.sk, v = b.dataset.sv;
    if (k === 'close') { closeSet(); return; }
    if (k === 'reset') { S = Object.assign({}, S0); drop(LS, 'eb_set'); drop(LS, 'theme'); root.removeAttribute('data-theme'); }
    else if (k === 'theme') { if (v === 'system') { drop(LS, 'theme'); root.removeAttribute('data-theme'); } else { put(LS, 'theme', v); root.setAttribute('data-theme', v); } }
    else if (k === 'ext') {
      if (v === '1') { put(LS, 'eb_consent', 'all'); cb.hidden = true; pollStatus(); pollServer(); }
      else { put(LS, 'eb_consent', 'min'); cb.hidden = true; var d = $('dstat'); if (d) d.hidden = true; srvData = null; renderSrv(); $('sic').textContent = 'U'; }
    }
    else S[k] = (k === 'calm' || k === 'egg') ? v === '1' : v;
    if (k !== 'reset') put(LS, 'eb_set', JSON.stringify(S));
    applySet(); renderSet();
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-act=settings]'); if (!t) return;
    renderSet(); sp.hidden = false;
  });

 

  /* ---------- Mitglieder: Aufgaben, Meine Bots, Export ---------- */
  function readTd() { try { var a = JSON.parse(get(LS, 'eb_todo_' + user.name) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function readMb() { try { var a = JSON.parse(get(LS, 'eb_bots_' + user.name) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function addTd() { var inp = $('td-in'), t = inp && inp.value.trim(); if (!t) return; var a = readTd(); a.unshift({ t: t, d: 0 }); put(LS, 'eb_todo_' + user.name, JSON.stringify(a)); renderMember(); var n = $('td-in'); if (n) n.focus(); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'td-in') { e.preventDefault(); addTd(); } else if (e.key === 'Enter' && e.target.id === 'mb-n') { e.preventDefault(); var b = document.querySelector('[data-act=mb-save]'); if (b) b.click(); } });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]'); if (!b || !user) return;
    var act = b.dataset.act, i = +b.dataset.i;
    if (act === 'td-add') addTd();
    else if (act === 'td-tg') { var a = readTd(); if (a[i]) a[i].d = a[i].d ? 0 : 1; put(LS, 'eb_todo_' + user.name, JSON.stringify(a)); renderMember(); }
    else if (act === 'td-del') { var a2 = readTd(); a2.splice(i, 1); put(LS, 'eb_todo_' + user.name, JSON.stringify(a2)); renderMember(); }
    else if (act === 'mb-save') {
      var nm = ($('mb-n').value || '').trim() || bbName; if (!Object.keys(bbSel).length && !bbCmds.length) { toast('Wähle zuerst Funktionen im Bot-Builder.'); return; }
      var m = readMb().filter(function (x) { return x.n !== nm; }); m.unshift({ n: nm, cfgd: clone({ sel: bbSel, name: bbName, stat: bbStat, id: bbId, cmds: bbCmds, cfg: bbCfg }) });
      put(LS, 'eb_bots_' + user.name, JSON.stringify(m)); renderMember(); toast('Gespeichert.');
    }
    else if (act === 'mb-load') { var o = (readMb()[i] || {}).cfgd; if (!o) return; bbSel = o.sel || {}; bbName = o.name || bbName; bbStat = o.stat || ''; bbId = o.id || ''; bbCmds = o.cmds || []; bbCfg = Object.assign(bbCfg, o.cfg); bbSave(); renderBB(); setPg('bot'); toast('Konfiguration geladen.'); }
    else if (act === 'mb-del') { var m2 = readMb(); m2.splice(i, 1); put(LS, 'eb_bots_' + user.name, JSON.stringify(m2)); renderMember(); }
    else if (act === 'exportall') {
      var dump = { user: user.name, lesezeichen: readBm(), notizen: get(LS, noteKey()) || '', aufgaben: readTd(), bots: readMb(), favoriten: readFav() };
      var u = URL.createObjectURL(new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' })), l = document.createElement('a');
      l.href = u; l.download = user.name + '-daten.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); toast('Export gestartet.');
    }
  });
  var PGS = ['start', 'bot'], wrapEl = document.querySelector('.wrap');
  wrapEl.dataset.pg = 'start';
  function syncNv() {
    var b = document.querySelector('.nv[data-pg=member]'); if (!b) return;
    b.hidden = false;
  }
  function setPg(p, keep) {
    if (PGS.indexOf(p) < 0) p = 'start'; wrapEl.dataset.pg = p;
    document.querySelectorAll('.nv').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.pg === p ? 'true' : 'false'); });
    if (!keep) { try { history.replaceState(null, '', '#' + p); } catch (e) {} window.scrollTo(0, 0); }
  }
  document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('.nv'); if (b) setPg(b.dataset.pg); });
  window.addEventListener('hashchange', function () { setPg(location.hash.slice(1), true); });
  setPg(location.hash.slice(1), true);

  renderAll();

  // data.json aus GitHub laden (überschreibt die eingebetteten Standardwerte)
  fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (!j) return;
    if (Array.isArray(j.links)) links = j.links;
    if (j.texts) texts = j.texts;
    if (Array.isArray(j.files)) files = j.files;
    if (Array.isArray(j.reqs)) reqs = j.reqs;
    if (admin) { draft = clone(links); dtexts = clone(texts); dfiles = clone(files); }
    renderAll();
  }).catch(function () {});
})();
</script>

</body></html>
