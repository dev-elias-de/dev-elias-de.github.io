    var tg = e.target, typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable);
    if (e.key === '/' && !typing && ov.hidden && $('fq')) { e.preventDefault(); $('fq').focus(); $('fq').scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  });

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.dataset.act, i = +b.dataset.i;
    if (act === 'register') openModal('');
    else if (act === 'unlock') openModal(user.name);
    else if (act === 'close') closeModal();
    else if (act === 'logout') {
      user = null; admin = false; draft = null; dtexts = null; dfiles = null; busy = false;
      drop(LS, 'eb_user'); drop(SS, 'eb_admin'); renderAll(); toast('Abgemeldet.');
    }
    else if (act === 'theme') { var n = theme() === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', n); put(LS, 'theme', n); }
    else if (act === 'tab') { clearTimeout(wipeT); wipeT = 0; tab = b.dataset.t; renderMember(); }
    else if (act === 'bm-del') { var bm = readBm(); bm.splice(i, 1); put(LS, bmKey(), JSON.stringify(bm)); renderMember(); }
    else if (act === 'copy') { copyText(files[i].url, 'Link kopiert.'); }
    else if (act === 'copynotes') { var nt = $('notes'); copyText(nt ? nt.value : '', 'Notizen kopiert.'); }
    else if (act === 'star') { var fv = readFav(), u1 = files[i].url, ix = fv.indexOf(u1); if (ix > -1) fv.splice(ix, 1); else fv.push(u1); put(LS, favKey(), JSON.stringify(fv)); renderFileList(); }
    else if (act === 'favfilter') { favOnly = !favOnly; b.classList.toggle('on', favOnly); b.setAttribute('aria-pressed', favOnly); renderFileList(); }
    else if (act === 'wipe') {
      if (!wipeT) { b.textContent = 'Wirklich alles löschen?'; wipeT = setTimeout(function () { wipeT = 0; renderMember(); }, 4000); }
      else { clearTimeout(wipeT); wipeT = 0; wipeUser(); }
    }
    else if (admin && act === 'add') { var la = b.dataset.l === 'files' ? dfiles : draft; la.push(b.dataset.l === 'files' ? { label: '', meta: '', url: '', added: new Date().toISOString() } : { label: '', meta: '', url: '' }); relist(b.dataset.l); var ins = document.querySelectorAll('.erow[data-l="' + (b.dataset.l || 'links') + '"]'); var last = ins[ins.length - 1]; if (last) last.querySelector('.inp').focus(); }
    else if (admin && act === 'del') { (b.dataset.l === 'files' ? dfiles : draft).splice(i, 1); relist(b.dataset.l); }
    else if (admin && act === 'up' && i > 0) { var lu = b.dataset.l === 'files' ? dfiles : draft; var t1 = lu[i - 1]; lu[i - 1] = lu[i]; lu[i] = t1; relist(b.dataset.l); }
    else if (admin && act === 'down') { var ld = b.dataset.l === 'files' ? dfiles : draft; if (i < ld.length - 1) { var t2 = ld[i + 1]; ld[i + 1] = ld[i]; ld[i] = t2; relist(b.dataset.l); } }
    else if (admin && act === 'reset') { draft = clone(links); dfiles = clone(files); dtexts = clone(texts); renderLinks(); renderFiles(); toast('Änderungen verworfen.'); }
    else if (admin && act === 'publish') publishLinks();
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (admin && t.dataset && t.dataset.t) {
      dtexts[t.dataset.t] = t.textContent; updateBar();
    } else if (admin && t.dataset && t.dataset.f) {
      var row = t.closest('[data-i]');
      if (row) { (row.dataset.l === 'files' ? dfiles : draft)[+row.dataset.i][t.dataset.f] = t.value; t.classList.remove('bad'); updateBar(); }
    } else if (user && t.id === 'notes') {
      put(LS, noteKey(), t.value);
      $('ncount').textContent = t.value.length + ' Zeichen · wird automatisch gespeichert';
    } else if (t.id === 'fq') { fq = t.value; renderFileList(); }
    else if (t.id === 'bm-url') t.classList.remove('bad');
  });
  document.addEventListener('submit', function (e) {
    if (e.target.dataset && e.target.dataset.form === 'bm') { e.preventDefault(); addBm(); }
  });

  function renderAll() { renderTop(); renderLinks(); renderFiles(); renderMember(); applyTexts(); }
  // Discord-Status ueber Lanyard (funktioniert auf normalen Webseiten, im Artifact blockiert)
  var DID = '1509263591000510585';
  function pollStatus() {
    var el = document.getElementById('dstat'); if (!el || !window.fetch) return;
    fetch('https://api.lanyard.rest/v1/users/' + DID).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.success) { el.hidden = true; return; }
      var d = j.data, st = d.discord_status || 'offline';
      var names = { online: 'Online', idle: 'Abwesend', dnd: 'Bitte nicht stören', offline: 'Offline' };
      var cls = st === 'online' ? 'on' : st;
      var txt = names[st] || 'Offline', extra = '';
      var acts = d.activities || [];
      for (var i = 0; i < acts.length; i++) {
        if (acts[i].type === 4 && acts[i].state) extra = acts[i].state;
        else if (acts[i].type === 0 && !extra) extra = 'Spielt ' + acts[i].name;
      }
      el.className = 'dstat ' + cls; el.hidden = false;
      el.querySelector('.dt').textContent = 'Discord · ' + txt + (extra ? ' · ' + extra : '');
    }).catch(function () { el.hidden = true; });
  }
  pollStatus(); setInterval(pollStatus, 30000);

  // Bot-/VPS-Status: das Skript auf dem VPS schreibt regelmaessig ein Gist (status.json)
  var BOT_URL = ''; // hier die Raw-URL des Gists eintragen
  function pollBot() {
    var el = document.getElementById('bstat'); if (!el || !BOT_URL || !window.fetch) return;
    fetch(BOT_URL + (BOT_URL.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      var age = (Date.now() / 1000) - (j.ts || 0), up = j.bot === 'active' && age < 180;
      var t = 'Bot · ' + (up ? 'Online' : 'Offline');
      if (up && j.cpu != null) t += ' · VPS ' + Math.round(j.cpu) + '% CPU, ' + Math.round(j.mem) + '% RAM';
      if (up && j.up) t += ' · läuft seit ' + j.up;
      el.className = 'dstat' + (up ? ' up' : ''); el.hidden = false;
      el.querySelector('.dt').textContent = t;
    }).catch(function () { el.hidden = true; });
  }
  pollBot(); setInterval(pollBot, 60000);

  touchVisit();
  renderAll();
})();
</script></body></html>
