<!DOCTYPE html>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme=dark]{--bg:#000;--fg:#fff;--mu:#8c8c8c;--bd:#262626;color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.6 "Bricolage Grotesque",system-ui,sans-serif;transition:background .5s,color .5s;overflow-x:hidden}

.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.pill{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:999px;padding:.4rem .9rem;font:inherit;font-size:.9rem;cursor:pointer;transition:background .25s,color .25s}

.n{font-size:clamp(4rem,20vw,15rem);font-weight:800;letter-spacing:-.05em}
.ch{display:inline-block;animation:up .95s cubic-bezier(.2,.9,.1,1) both;animation-delay:calc(var(--i)*70ms + .15s)}
@keyframes up{from{transform:translateY(110%) rotate(6deg)}to{transform:none}}
html:not(.go) .ch,html:not(.go) .role{animation-play-state:paused}
html.ed .ch{animation:none}
.role{font-size:clamp(1.2rem,3vw,1.8rem);margin:1.5rem 0 2rem;min-height:2.3rem;animation:fi 1s 1s both}

.role::after{content:"";display:inline-block;width:2px;height:1em;background:var(--fg);margin-left:4px;vertical-align:-.12em;animation:bl 1s steps(1) infinite}

.btn.alt{background:transparent;color:var(--fg);border-color:var(--bd)}

.rv{opacity:0;transform:translateY(48px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}

.pr{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1.4fr auto;gap:1rem;align-items:center;padding:1.6rem .75rem;border-bottom:1px solid var(--bd);text-decoration:none}
.pr::before{content:"";position:absolute;inset:0;background:var(--fg);transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.7,0,.2,1)}

.pr>*{position:relative;transition:color .3s,transform .4s}
.pr b{font-size:clamp(1.3rem,3vw,1.8rem)}.pr span{color:var(--mu)}

.pr:hover>*{color:var(--bg)}.pr:hover span{color:var(--bg)}
@media(max-width:640px){.pr{grid-template-columns:1fr auto}.pr span{grid-column:1/-1;order:3}}

.ghost{background:none;border:0;color:var(--mu);font:inherit;cursor:pointer;text-decoration:underline}
#spg{position:fixed;top:0;left:0;right:0;height:2px;background:var(--fg);transform:scaleX(0);transform-origin:left;z-index:60;pointer-events:none}
.tag{border:1px solid var(--bd);border-radius:999px;padding:.55rem 1.15rem;transition:background .25s,color .25s,transform .25s,border-color .25s}
.tag:hover{background:var(--fg);color:var(--bg);border-color:var(--fg);transform:translateY(-3px)}
#cox{max-width:36rem;margin:0 0 1.5rem;font-size:clamp(1.1rem,3vw,1.4rem);color:var(--mu)}
.pr b small{font-size:.55em;font-weight:600;opacity:.5;margin-right:.9rem;letter-spacing:.06em;vertical-align:.25em}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1rem}
.card{display:flex;align-items:center;gap:1rem;border:1px solid var(--bd);border-radius:20px;padding:1.1rem 1.25rem;transition:border-color .3s,transform .3s}

.card .di{display:grid;gap:.15rem;min-width:0;flex:1}

.av i[data-s=online]{background:#23a55a}.av i[data-s=idle]{background:#f0b232}.av i[data-s=dnd]{background:#f23f43}
.card .btn{flex:none;padding:.6rem 1.1rem}
#sp{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(520px circle at var(--mx,50%) var(--my,25%),color-mix(in srgb,var(--fg) 9%,transparent),transparent 70%)}

#cu{position:fixed;left:-9px;top:-9px;width:18px;height:18px;margin:0;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:99;transition:width .25s,height .25s,margin .25s}

html.ld-on,html.ld-on body{overflow:hidden}
#ld{position:fixed;inset:0;background:var(--bg);color:var(--fg);z-index:200;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s}
#ld .lb{width:min(260px,60vw);display:grid;gap:.9rem;justify-items:center;animation:lin .8s .1s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .6s cubic-bezier(.7,0,.3,1),opacity .4s}
@keyframes lin{from{opacity:0;transform:translateY(14px)}}
#ld .lbar{width:100%;height:3px;background:var(--bd);border-radius:3px;overflow:hidden;position:relative}
#ld .lbar i{position:absolute;inset:0;background:var(--fg);border-radius:3px;transform:scaleX(0);transform-origin:left;will-change:transform}
#ld .lbar i::after{content:"";position:absolute;top:0;right:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,var(--bg));opacity:.55;animation:sh 1.1s ease-in-out infinite}
@keyframes sh{from{transform:translateX(-120%)}to{transform:translateX(0)}}
#ld .lcn{font-size:.85rem;font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums;letter-spacing:.08em}
#ld.done{opacity:0;visibility:hidden}
#ld.done .lb{transform:scale(.94)}
html[data-anim=off] #ld{display:none}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:22px;padding:0;width:min(560px,calc(100% - 2rem));max-height:calc(100% - 2rem)}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
dialog[open]{animation:pop .5s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.95)}}
.dp{padding:1.5rem}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;font-size:1.2rem}
.pg{height:3px;background:var(--bd);border-radius:3px;margin-bottom:1.25rem}.pg i{display:block;height:100%;background:var(--fg);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stp{display:grid;gap:1rem;animation:sl .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes sl{from{opacity:0;transform:translateX(28px)}}
.q{margin:0;font-size:1.3rem;font-weight:600}.muted{color:var(--mu);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{border:1px solid var(--bd);background:none;color:var(--fg);padding:.6rem 1.1rem;border-radius:999px;font:inherit;cursor:pointer;transition:all .25s}
.chip:hover{border-color:var(--fg)}.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg);transform:scale(1.05)}
label{display:grid;gap:.35rem;color:var(--mu);font-size:.95rem}
input,textarea,select{background:transparent;color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:.7rem .85rem;font:inherit;width:100%;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--fg);outline:0}
textarea{resize:vertical}
.err{min-height:1.4rem;margin:.75rem 0 0;font-weight:600}
.dn{display:flex;justify-content:space-between;gap:.75rem}
#sum{white-space:pre-wrap;border:1px solid var(--bd);border-radius:10px;padding:.8rem;font-size:.9rem;color:var(--mu);margin:0}
.code{display:block;font-size:clamp(2rem,9vw,3rem);font-weight:800;letter-spacing:.04em;border:1px solid var(--bd);border-radius:14px;padding:.5rem 1.2rem;margin:.3rem 0 .6rem;user-select:all}
.ok{text-align:center;justify-items:center}.ok svg{width:84px}
.dr{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:dr .9s .1s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
html[data-anim=off] .dr{stroke-dashoffset:0}
.set{display:grid;gap:1rem}.set>div{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.set select{width:auto}.set input[type=checkbox]{width:1.3rem;height:1.3rem}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);border-left:1px solid var(--bd);overflow:auto;padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px));z-index:50}
#dr h3{margin:1.25rem 0 .5rem}
fieldset{border:1px solid var(--bd);border-radius:10px;margin:0 0 1rem;display:grid;gap:.6rem}
.f{margin-bottom:.75rem}
.sm{background:none;color:var(--fg);border:1px solid var(--bd);border-radius:999px;padding:.35rem .8rem;font:inherit;font-size:.85rem;cursor:pointer;margin:0 .4rem .4rem 0}
.req{border-bottom:1px solid var(--bd);padding:.5rem 0}.req p{margin:.25rem 0;white-space:pre-wrap;color:var(--mu);font-size:.9rem}
#json{min-height:9rem;font-family:ui-monospace,monospace;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;z-index:300}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}#ld{display:none}.dr{stroke-dashoffset:0}html.ld-on,html.ld-on body{overflow:auto}}
html[data-anim=off] *,html[data-anim=off] *::before{animation:none!important;transition:none!important}
input,textarea,select{font-size:16px}
.pill,.chip,.btn{min-height:44px}
.pill{display:inline-flex;align-items:center;gap:.35em}
@media(max-width:640px){
.card{flex-wrap:wrap}.card .btn{flex:1 1 100%;text-align:center}
header{padding-top:1rem}
.hero{padding-top:2.5rem}
.hero .row .btn{flex:1 1 auto;text-align:center}
section{padding:3rem 0}
dialog{width:100%;max-width:100%;max-height:92dvh;margin:auto 0 0;border-radius:22px 22px 0 0;border-bottom:0}
.dp{padding:1.25rem 1.1rem calc(1.25rem + env(safe-area-inset-bottom,0px))}
.dn .btn{flex:1}
footer{flex-wrap:wrap}
}
@media(hover:none){.card:hover{transform:none;border-color:var(--bd)}.tag:hover{background:none;color:var(--fg);border-color:var(--bd);transform:none}#sp,#cu{display:none!important}.pr::before{display:none}.pill:hover{background:none;color:var(--fg)}.btn:hover{background:var(--fg);color:var(--bg)}.btn.alt:hover{background:transparent;color:var(--fg)}.pr:hover>*{color:inherit}.pr:hover span{color:var(--mu)}.pr:hover i{transform:none}}
</style>
</head>
<body>
<div id="ld" aria-hidden="true"><div class="lb"><div class="lbar"><i id="lf"></i></div><div class="lcn"><span id="lc">0</span>%</div></div></div>
<div id="spg" aria-hidden="true"></div><div id="sp" aria-hidden="true"></div><div id="cu" aria-hidden="true"></div>
<header class="w"><b id="br"></b><div class="row"><button class="pill" id="se" type="button">Einstellungen</button></div></header>
<main class="w">
<section class="hero"><h1 id="h1"><span class="ln g" id="gr" aria-hidden="true"></span><span class="ln n" id="nm" aria-hidden="true"></span></h1>
<p class="role"><span id="rt"></span></p>
<div class="row"><span class="row" id="hl"></span></div></section>
<section id="about" class="rv"><h2 id="at"></h2><p id="ab"></p></section>
<section id="skills" class="rv"><h2 id="skt"></h2><div class="row" id="skl"></div></section>
<section id="projects"><h2 id="pt" class="rv"></h2><div id="pl"></div></section>
<section id="discord" class="rv"><h2 id="dct"></h2><div class="dg">
<div class="card" id="dpr"><div class="av"><img id="lav" alt="" width="64" height="64"><i id="lad" data-s="offline"></i></div><div class="di"><b id="lan">Lade …</b><span id="ls1">Lade Status …</span><span id="ls2" hidden></span></div></div>
<div class="card" id="dsv"><img id="dsi" class="ic" alt="" width="64" height="64"><div class="di"><b id="dsn">Discord-Server</b><span id="dsc">Community beitreten</span></div><a class="btn mag" id="dsj" target="_blank" rel="noopener noreferrer">Beitreten</a></div>
</div></section>

</main>
<footer class="w"><span id="ft"></span><button class="ghost" id="up" type="button">Nach oben ↑</button></footer>


<dialog id="sm"><div class="dp"><div class="dh"><b>Einstellungen</b><button class="pill" data-close type="button" aria-label="Schließen">✕</button></div>
<div class="set">
<div><label for="th">Thema</label><select id="th"><option value="dark">Schwarz</option><option value="light">Weiß</option></select></div>
<div><label for="an">Animationen und Cursor</label><input type="checkbox" id="an"></div>

</div></div></dialog>

<div style="margin-top:.5rem"><button class="sm" id="ja" type="button">JSON übernehmen</button><button class="sm" id="jc" type="button">JSON kopieren</button><button class="sm" id="jr" type="button">Zurücksetzen</button></div>

<p class="muted">Für GitHub Pages. Das Token (nur dieses Repo, Contents: Read and write) bleibt nur in diesem Browser.</p>
<label class="f">Repo (name/repo)<input id="ghr" placeholder="dev-elias-de/mein-repo" autocomplete="off"></label>
<label class="f">Branch<input id="ghb" value="main"></label>
<label class="f">Datei<input id="ghf" value="config.json"></label>

<button class="sm" id="ghs" type="button">In GitHub speichern</button>

<div id="toast" hidden role="status"></div>

<script>
const DEF={greeting:"Hallo, ich bin",name:"Elias",roles:"Entwickler, Bot-Builder, Tüftler",aboutTitle:"Über mich",about:"Ich bin Elias und entwickle eigene Projekte und Discord-Bots, von der ersten Idee bis zum fertigen Ergebnis. Am liebsten baue ich Dinge, die andere wirklich benutzen können. Hier findest du meine Website und meine aktuellen Projekte. Gerade arbeite ich an einem eigenen Discord-Bot, der bald erscheint.",skillsTitle:"Skills",skills:"Python, discord.py, JavaScript, HTML & CSS, GitHub",projectsTitle:"Projekte",discordTitle:"Discord",lanyardId:"1509263591000510585",projects:[{label:"Meine Website",url:"https://github.com/dev-elias-de/dev-elias-de.github.io",text:"dev-elias-de.github.io"},{label:"Discord Bot",url:"https://coming-soon-page-e.netlify.app/",text:"Coming soon"}],links:[{label:"GitHub",url:"https://github.com/dev-elias-de",text:""},{label:"Discord",url:"https://discord.gg/ySwntZUFBh",text:""}],contactTitle:"Kontakt",contactText:"Du hast eine Idee oder brauchst einen eigenen Discord-Bot? Schreib mir auf Discord.",footer:"© Elias"};
const ARR={links:{label:"Neu",url:"https://",text:""},projects:{label:"Neues Projekt",url:"https://",text:""}};
const LB={greeting:"Begrüßung",name:"Name",roles:"Rollen (Komma-getrennt)",aboutTitle:"Titel „Über mich“",about:"Text „Über mich“",skillsTitle:"Titel Skills",skills:"Skills (Komma-getrennt)",projectsTitle:"Titel Projekte",discordTitle:"Titel Discord",lanyardId:"Discord-User-ID (für Lanyard-Status)",contactTitle:"Titel Kontakt",contactText:"Text Kontakt",footer:"Fußzeile",label:"Name",url:"Adresse",text:"Beschreibung"};
let cfg=structuredClone(DEF),db=null,docRef=null,canEdit=false,editing=false,tm,tt,mg=null;
const $=s=>document.querySelector(s),root=document.documentElement;
const el=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==="class")e.className=v;else if(a.startsWith("on"))e.addEventListener(a.slice(2),v);else e[a]=v}e.append(...k.flat());return e};
const safe=u=>/^https?:\/\//i.test(u)?u:"#";
const csv=s=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
const merge=o=>{const c=Object.assign(structuredClone(DEF),o||{});for(const k in ARR)if(!Array.isArray(c[k]))c[k]=[];return c};
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)};
const st=m=>$("#sv").textContent=m;

const S={theme:"dark",anim:true,size:"m"};
try{Object.assign(S,JSON.parse(localStorage.getItem("dev-settings")||"{}"))}catch{}
const fine=matchMedia("(pointer:fine)").matches;
function applyS(){root.dataset.theme=S.theme;root.dataset.anim=S.anim?"on":"off";root.dataset.size=S.size;$("#th").value=S.theme;$("#an").checked=S.anim;$("#sz").value=S.size;$("#cu").hidden=!fine}
function saveS(){try{localStorage.setItem("dev-settings",JSON.stringify(S))}catch{}applyS()}
$("#th").onchange=e=>{S.theme=e.target.value;saveS()};
$("#an").onchange=e=>{S.anim=e.target.checked;saveS()};
$("#sz").onchange=e=>{S.size=e.target.value;saveS()};
$("#se").onclick=()=>$("#sm").showModal();

function setChars(e,t){if(e.dataset.t===t)return;e.dataset.t=t;e.replaceChildren(...[...t].map((c,i)=>el("span",{class:"ch",style:"--i:"+i,textContent:c===" "?"\u00a0":c})))}
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
function render(){
 document.title=cfg.name;$("#br").textContent=cfg.name;$("#h1").setAttribute("aria-label",cfg.greeting+" "+cfg.name);
 setChars($("#gr"),cfg.greeting);setChars($("#nm"),cfg.name);
 $("#hl").replaceChildren(...cfg.links.map(l=>el("a",{class:"btn alt mag",href:safe(l.url),target:"_blank",rel:"noopener noreferrer",textContent:l.label})));
 $("#at").textContent=cfg.aboutTitle;$("#ab").textContent=cfg.about;$("#about").hidden=!cfg.about;
 $("#skt").textContent=cfg.skillsTitle;$("#skl").replaceChildren(...csv(cfg.skills).map(x=>el("span",{class:"tag",textContent:x})));$("#skills").hidden=!csv(cfg.skills).length;
 $("#cot").textContent=cfg.contactTitle;$("#cox").textContent=cfg.contactText;$("#cox").hidden=!cfg.contactText;

   cfg[k].forEach((l,n)=>box.append(el("fieldset",{},el("legend",{},(k==="links"?"Link ":"Projekt ")+(n+1)),...["label","url","text"].map(f=>field(l,f)),el("button",{type:"button",class:"sm",onclick:()=>{cfg[k].splice(n,1);buildForm();changed()}},"Entfernen"))));
   box.append(el("button",{type:"button",class:"sm",onclick:()=>{cfg[k].push({...ARR[k]});buildForm();changed()}},k==="links"?"Link hinzufügen":"Projekt hinzufügen"));

 }

}

const GH={};
try{Object.assign(GH,JSON.parse(localStorage.getItem("dev-gh")||"{}"))}catch{}
["ghr","ghb","ghf","ght"].forEach((id,i)=>{const k=["repo","branch","path","token"][i];if(GH[k])$("#"+id).value=GH[k]});
$("#ghs").onclick=async()=>{
 const g=id=>$("#"+id).value.trim(),repo=g("ghr"),branch=g("ghb")||"main",path=g("ghf")||"config.json",token=g("ght");
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token)return st("Trage Repo (name/repo) und Token ein.");
 try{localStorage.setItem("dev-gh",JSON.stringify({repo,branch,path,token}))}catch{}
 const u="https://api.github.com/repos/"+repo+"/contents/"+path.split("/").map(encodeURIComponent).join("/"),h={Authorization:"Bearer "+token,Accept:"application/vnd.github+json"};
 st("Speichere in GitHub …");
 try{
  const r=await fetch(u+"?ref="+encodeURIComponent(branch),{headers:h});let sha;
  if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw new Error("Lesen: "+r.status);
  const body={message:"Website-Inhalt aktualisiert",branch,content:btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,2)))),...(sha?{sha}:{})};
  const w=await fetch(u,{method:"PUT",headers:{...h,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!w.ok)throw new Error("Schreiben: "+w.status);
  st("In GitHub gespeichert. Pages braucht etwa eine Minute zum Aktualisieren.");
 }catch(e){st("GitHub-Fehler ("+e.message+"). Prüfe Repo, Branch und Token.")}
};

// Login nur per Konsole: adminLogin("passwort"). Im Code steht nur ein PBKDF2-Hash.
let tries=0;
const HASH="50dd0af8562c3a1aa61b6d100310ccafb84014ffd6794f9f44e7d1a1b74b039e";
window.adminLogin=async pw=>{
 if(tries>=5)return"Zu viele Versuche. Lade die Seite neu.";
 try{
  const enc=new TextEncoder(),k=await crypto.subtle.importKey("raw",enc.encode(String(pw)),"PBKDF2",false,["deriveBits"]);
  const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode("elias-site-v1"),iterations:200000,hash:"SHA-256"},k,256);
  const hex=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  if(hex!==HASH){tries++;return"Falsches Passwort."}
  canEdit=true;
  if(!editing)toggleEdit();toast("Admin-Modus freigeschaltet");return"Freigeschaltet.";
 }catch{return"Fehler beim Prüfen."}
};

// Discord: Server-Karte (Invite-API) und Live-Status (Lanyard)
const dinv=()=>{const l=cfg.links.find(l=>/discord/i.test(l.label+l.url)),m=l&&l.url.match(/discord(?:\.gg|\.com\/invite)\/([\w-]+)/i);return m?[m[1],l.url]:null};
let dK="",lyId="",lyWs=null,lyHb=0,lyRetry=0;
const ST={online:"Online",idle:"Abwesend",dnd:"Bitte nicht stören",offline:"Offline"},VB={0:"Spielt",1:"Streamt",2:"Hört",3:"Schaut",5:"Tritt an in"};
const nf=n=>new Intl.NumberFormat("de-DE").format(n);
function loadSrv(c){
 fetch("https://discord.com/api/v9/invites/"+encodeURIComponent(c)+"?with_counts=true").then(r=>r.ok?r.json():Promise.reject()).then(j=>{
  if(c!==dK)return;const g=j.guild||{};
  $("#dsn").textContent=g.name||"Discord-Server";
  if(g.icon)$("#dsi").src="https://cdn.discordapp.com/icons/"+g.id+"/"+g.icon+".png?size=128";
  if(j.approximate_member_count)$("#dsc").textContent=nf(j.approximate_presence_count||0)+" online · "+nf(j.approximate_member_count)+" Mitglieder";
 }).catch(()=>{});
}
function lyDraw(d){
 if(!d)return;const u=d.discord_user||{};
 $("#lan").textContent=u.global_name||u.username||"Discord";
 if(u.id)$("#lav").src=u.avatar?"https://cdn.discordapp.com/avatars/"+u.id+"/"+u.avatar+".png?size=128":"https://cdn.discordapp.com/embed/avatars/"+Number((BigInt(u.id)>>22n)%6n)+".png";
 $("#lad").dataset.s=d.discord_status||"offline";
 const a=d.activities||[],cu=a.find(x=>x.type===4),ma=a.find(x=>x.type!==4&&x.name!=="Spotify");
 const cs=cu?((cu.emoji&&cu.emoji.name||"")+" "+(cu.state||"")).trim():"";
 $("#ls1").textContent=cs||ST[d.discord_status]||"Offline";
 let l2="";
 if(d.listening_to_spotify&&d.spotify)l2="♪ "+d.spotify.song+" – "+String(d.spotify.artist||"").replace(/;/g,",");
 else if(ma)l2=(VB[ma.type]||"")+" "+ma.name;
 $("#ls2").textContent=l2.trim();$("#ls2").hidden=!l2;
}
function lyStop(){clearInterval(lyHb);const w=lyWs;lyWs=null;if(w){w.onclose=null;try{w.close()}catch{}}}
function lyStart(){
 lyStop();const id=lyId;
 fetch("https://api.lanyard.rest/v1/users/"+id).then(r=>r.json()).then(j=>{if(id!==lyId)return;if(j.success)lyDraw(j.data);else{$("#lan").textContent="Discord";$("#ls1").textContent="Kein Status gefunden (Lanyard-Server beigetreten?)"}}).catch(()=>{});
 const open=()=>{if(id!==lyId)return;let ws;try{ws=new WebSocket("wss://api.lanyard.rest/socket")}catch{return}
  lyWs=ws;
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
   if(m.op===1){lyRetry=0;ws.send(JSON.stringify({op:2,d:{subscribe_to_id:id}}));clearInterval(lyHb);lyHb=setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({op:3}))},m.d.heartbeat_interval)}
   else if(m.op===0&&(m.t==="INIT_STATE"||m.t==="PRESENCE_UPDATE"))lyDraw(m.d)};
  ws.onclose=()=>{clearInterval(lyHb);if(id===lyId&&lyWs===ws)setTimeout(open,Math.min(30000,2000*++lyRetry))};
 };open();
}
function discordSync(){
 const inv=dinv(),id=String(cfg.lanyardId||"").trim(),ok=/^\d{15,22}$/.test(id);
 $("#dct").textContent=cfg.discordTitle;
 $("#dsv").hidden=!inv;$("#dpr").hidden=!ok;$("#discord").hidden=!inv&&!ok;
 if(inv){$("#dsj").href=safe(inv[1]);if(dK!==inv[0]){dK=inv[0];loadSrv(inv[0])}}
 if(ok&&lyId!==id){lyId=id;lyStart()}else if(!ok&&lyId){lyId="";lyStop()}
}

// Ladebildschirm: Zähler + Ladebalken, startet danach die Hero-Animation
(function(){
 const ld=$("#ld"),lc=$("#lc"),lf=$("#lf");
 const start=()=>root.classList.add("go");
 const end=()=>{ld.hidden=true;root.classList.remove("ld-on")};
 if(!S.anim||matchMedia("(prefers-reduced-motion:reduce)").matches){end();start();return}
 const MIN=2000,t0=performance.now();
 let ready=false,shown=0,over=false;
 Promise.all([document.fonts?document.fonts.ready:0,new Promise(r=>document.readyState==="complete"?r():addEventListener("load",r,{once:true}))]).then(()=>ready=true);
 setTimeout(()=>ready=true,5000);
 const ease=t=>1-Math.pow(1-t,3);
 function finish(){
  if(over)return;over=true;
  setTimeout(()=>{ld.classList.add("done");setTimeout(start,250);setTimeout(end,900)},350);
 }
 (function tick(now){
  const t=Math.min((now-t0)/MIN,1),cap=ready?100:90,target=Math.min(ease(t)*100,cap);
  shown+=Math.max((target-shown)*.14,target>shown?.12:0);
  if(shown>target)shown=target;
  if(ready&&t>=1&&shown>=99.4)shown=100;
  const v=Math.round(shown);
  lc.textContent=v;lf.style.transform="scaleX("+shown/100+")";
  if(shown>=100)finish();else requestAnimationFrame(tick);
 })(t0);
})();
